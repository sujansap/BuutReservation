name: dotnet acceptation testing

on: 
  pull_request:
    branches:
      - staging
      - main
      - production
  push:
    branches:
      - opst-testing

jobs:
  build:
    name: dotnet-run-all-tests
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: Hogent.Rise  # Zorg ervoor dat dit overeenkomt met je connection string
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432

    steps:
    
      - name: copy commit files into the runner
        uses: actions/checkout@v4

      - name: Install .NET SDK and Runtime
        run: |
          wget -q https://packages.microsoft.com/config/debian/12/packages-microsoft-prod.deb -O packages-microsoft-prod.deb
          sudo dpkg -i packages-microsoft-prod.deb
          rm packages-microsoft-prod.deb
          sudo apt-get update && \
          sudo apt-get install -y dotnet-sdk-8.0

      - name: Install dotnet-ef tool
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"  # Zorg ervoor dat dotnet-tools in de PATH staat
          dotnet tool install --global dotnet-ef

      - name: Run database migrations
        env:
          ConnectionStrings__PostgreSQL: "User ID=user;Password=password;Host=localhost;Port=5432;Database=Hogent.Rise;Connection Lifetime=0;"
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"  # Zorg ervoor dat dotnet-tools in de PATH staat
          dotnet ef database update --project Rise.Persistence --startup-project Rise.Server --configuration Release

      - name: Run the web-api application
        env:
          ConnectionStrings__PostgreSQL: "User ID=user;Password=password;Host=localhost;Port=5432;Database=Hogent.Rise;Connection Lifetime=0;"
        run: |
          dotnet run --project Rise.Server --configuration Release &  
 
      - name: Wait for the web-api-application to be ready on port https 5001
        run: |
          for i in {1..30}; do
            response=$(curl -s -k -o /dev/null -w "%{http_code}" https://localhost:5001 || echo "connection_error")
            
            if [ "$response" -eq 200 ]; then
              echo "Application is ready! HTTP status code: $response"
              break
            elif [ "$response" == "connection_error" ]; then
              echo "Connection failed. Application might not be running yet."
            else
              echo "Received HTTP status code: $response. Waiting for the application to be ready..."
            fi
            sleep 2
          done

      - name: Run Unit Tests
        run: dotnet test Rise.Domain.Tests

      - name: Run Integration Tests
        env:
          ConnectionStrings__PostgreSQL: "User ID=user;Password=password;Host=localhost;Port=5432;Database=Hogent.Rise;Connection Lifetime=0;"
        run: dotnet test Rise.Server.Tests



      # New steps for setting up and running Playwright tests------------------------------------------------------
      - name: Create Playwright test project
        run: |
          dotnet new nunit -n PlaywrightTests
          cd PlaywrightTests
          dotnet add package Microsoft.Playwright.NUnit

      - name: Build Playwright test project
        run: |
          cd PlaywrightTests
          dotnet build

      - name: Install PowerShell
        run: |
          wget -q https://github.com/PowerShell/PowerShell/releases/download/v7.4.6/powershell_7.4.6-1.deb_amd64.deb
          sudo dpkg -i powershell_7.4.6-1.deb_amd64.deb
          sudo apt-get install -f -y  # Fix any dependency issues


      - name: Install Playwright dependencies
        run: |
          sudo apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 \
              libdrm2 libxcb1 libxkbcommon0 libx11-6 libxcomposite1 libxdamage1 libxext6 \
              libxfixes3 libxrandr2 libgbm1 libpango-1.0-0 libcairo2 libasound2 libatspi2.0-0


      - name: Install Playwright browsers
        run: |
          pwsh PlaywrightTests/bin/Debug/net8.0/playwright.ps1 install

      - name: Run Playwright E2E
        run: |
          dotnet run --project Rise.Client &
 
      - name: Wait for the client  application to be ready on port https 5003
        run: |
          for i in {1..30}; do
            response=$(curl -s -k -o /dev/null -w "%{http_code}" https://localhost:5003 || echo "connection_error")
            
            if [ "$response" -eq 200 ]; then
              echo "Application is ready! HTTP status code: $response"
              break
            elif [ "$response" == "connection_error" ]; then
              echo "Connection failed. Application might not be running yet."
            else
              echo "Received HTTP status code: $response. Waiting for the application to be ready..."
            fi
            sleep 2
          done          
      - name: Run E2E Tests
        env:
          PLAYWRIGHT_SKIP_HTTPS_ERRORS: '1'  # Voeg deze regel toe om SSL-fouten te negeren      
        run: dotnet test Rise.Client.Tests

      - name: Check test result
        if: ${{ failure() }}
        run: echo "Tests failed, please check the logs."
