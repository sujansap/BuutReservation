name: dotnet acceptatie test voor push/pull-request

on: 
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging

concurrency:
  group: ${{ github.ref }}

jobs:
  build:
    runs-on: self-hosted

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: Hogent.Rise  # Zorg ervoor dat dit overeenkomt met je connection string
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Install .NET SDK
        run: |
          wget https://dot.net/v1/dotnet-install.sh
          chmod +x dotnet-install.sh
          ./dotnet-install.sh --version 8.0.403
          echo "$HOME/.dotnet" >> $GITHUB_PATH
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH  # Add tools to PATH
          export PATH="$HOME/.dotnet:$PATH"  # Ensure dotnet is in the path

      - name: Verify .NET installation
        run: |
          export PATH="$HOME/.dotnet:$PATH"  # Ensure dotnet is in the path
          dotnet --info

      - name: Install dotnet-ef tool
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"  # Ensure dotnet tools are in the path
          dotnet tool install --global dotnet-ef

      - name: Verify dotnet-ef installation
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"  # Ensure dotnet tools are in the path
          dotnet ef --version

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: dotnet restore

      - name: Build the application
        run: dotnet build --configuration Release --no-restore

      - name: Wait for PostgreSQL to be ready
        run: |
          for i in {1..30}; do
            if PGPASSWORD=password psql -h localhost -U user -d Hogent.Rise -c 'SELECT 1'; then
              echo "PostgreSQL is ready!"
              break
            else
              echo "Waiting for PostgreSQL to be ready..."
              sleep 5
            fi
          done

      - name: Run database migrations
        env:
          ConnectionStrings__PostgreSQL: "User ID=user;Password=password;Host=localhost;Port=5432;Database=Hogent.Rise;Connection Lifetime=0;"
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"  # Ensure dotnet tools are in the path
          dotnet ef database update --project Rise.Persistence --startup-project Rise.Server --configuration Release

      - name: Run the application
        env:
          ConnectionStrings__PostgreSQL: "User ID=user;Password=password;Host=localhost;Port=5432;Database=Hogent.Rise;Connection Lifetime=0;"
        run: |
          export PATH="$HOME/.dotnet/tools:$PATH"  # Ensure dotnet tools are in the path
          dotnet run --project Rise.Server --configuration Release &  
          sleep 10  

      - name: Run Unit Tests
        run: dotnet test Rise.Domain.Tests --verbosity normal

      - name: Run Integration Tests
        env:
          ConnectionStrings__PostgreSQL: "User ID=user;Password=password;Host=localhost;Port=5432;Database=Hogent.Rise;Connection Lifetime=0;"
        run: dotnet test Rise.Server.Tests --verbosity normal

      - name: Check test result
        if: ${{ failure() }}
        run: echo "Tests failed, please check the logs."
